name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      posts_only: ${{ steps.detect.outputs.posts_only }}
      has_posts: ${{ steps.detect.outputs.has_posts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
          echo "$files"
          # AGENTS.md rides along with posts and needs no build — drop it
          # before judging. Anything else non-post => full docker build.
          files=$(echo "$files" | grep -v '^AGENTS\.md$' || true)
          if echo "$files" | grep -q '^content/posts/.*\.md$'; then
            echo "has_posts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_posts=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$files" ] || ! echo "$files" | grep -qv '^content/posts/.*\.md$'; then
            echo "posts_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "posts_only=false" >> "$GITHUB_OUTPUT"
          fi

  docker-build:
    needs: detect
    if: needs.detect.outputs.posts_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Docker Hub rate-limits anonymous pulls (429 ToomanyRequests). Same
      # fallback pattern the GoModel gateway uses for provider rate limits:
      # on failure, retry through the mirror.gcr.io pull-through cache.
      - name: Set up buildx with Docker Hub mirror fallback
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build blog image (retry on pull rate limit)
        run: |
          for attempt in 1 2 3; do
            if docker buildx build --load -t wslbn-space-blog:ci .; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::docker build failed after 3 attempts (mirror + direct)"
              exit 1
            fi
            echo "Attempt $attempt failed — likely Docker Hub rate limit. Backing off 20s."
            sleep 20
          done

      - name: Smoke-test generated site
        run: |
          docker run -d --name blog -p 8080:80 wslbn-space-blog:ci
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/ | grep -q "wslbn.space"
          curl -sf http://localhost:8080/posts/hello-world/ | grep -q "Hello, wslbn.space"
          docker rm -f blog

  validate-posts:
    needs: detect
    if: needs.detect.outputs.has_posts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect changed posts
        id: files
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- 'content/posts/*.md')
          echo "$files"
          echo "list=$(echo "$files" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Validate post front matter + markdown
        run: node scripts/validate-posts.mjs ${{ steps.files.outputs.list }}
