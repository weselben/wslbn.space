name: Close foreign PRs

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    if: >
      github.actor != 'weselben' &&
      github.actor != 'dependabot[bot]'
    steps:
      - name: Close PR with explanation
        uses: actions/github-script@v9
        with:
          script: |
            const num = context.issue.number;
            await github.rest.issues.createComment({
              ...context.issue,
              body: 'This repository only accepts pull requests from @weselben or @dependabot[bot]. Closing — feel free to open an issue instead.'
            });
            await github.rest.pulls.update({
              ...context.issue,
              pull_number: num,
              state: 'closed'
            });
